name: 'Release 打包'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传的版本标签，例如 v1.0.20261124；留空则只构建不上传'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  release:
    types: [published, released]

permissions:
  contents: write

concurrency:
  group: 'ferc-release-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build:
    name: '构建 ${{ matrix.target }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-386,      goos: linux,   goarch: 386,      goarm: '', ext: ''   }
          - { target: linux-amd64,    goos: linux,   goarch: amd64,    goarm: '', ext: ''   }
          - { target: linux-armv6,    goos: linux,   goarch: arm,      goarm: '6', ext: ''   }
          - { target: linux-armv7,    goos: linux,   goarch: arm,      goarm: '7', ext: ''   }
          - { target: linux-arm64,    goos: linux,   goarch: arm64,    goarm: '', ext: ''   }
          - { target: linux-loong64,  goos: linux,   goarch: loong64,  goarm: '', ext: ''   }
          - { target: linux-mips,     goos: linux,   goarch: mips,     goarm: '', ext: ''   }
          - { target: linux-mipsle,   goos: linux,   goarch: mipsle,   goarm: '', ext: ''   }
          - { target: linux-mips64,   goos: linux,   goarch: mips64,   goarm: '', ext: ''   }
          - { target: linux-mips64le, goos: linux,   goarch: mips64le, goarm: '', ext: ''   }
          - { target: linux-ppc64,    goos: linux,   goarch: ppc64,    goarm: '', ext: ''   }
          - { target: linux-ppc64le,  goos: linux,   goarch: ppc64le,  goarm: '', ext: ''   }
          - { target: linux-riscv64,  goos: linux,   goarch: riscv64,  goarm: '', ext: ''   }
          - { target: linux-s390x,    goos: linux,   goarch: s390x,    goarm: '', ext: ''   }
          - { target: darwin-amd64,   goos: darwin,  goarch: amd64,    goarm: '', ext: ''   }
          - { target: darwin-arm64,   goos: darwin,  goarch: arm64,    goarm: '', ext: ''   }
          - { target: windows-386,    goos: windows, goarch: 386,      goarm: '', ext: .exe }
          - { target: windows-amd64,  goos: windows, goarch: amd64,    goarm: '', ext: .exe }
          - { target: windows-arm64,  goos: windows, goarch: arm64,    goarm: '', ext: .exe }
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27.4'
    - name: '编译 ${{ matrix.target }}'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME}"
        case "$version" in
          v*) ;;
          *) version="$(cat VERSION | tr -d '[:space:]')" ;;
        esac
        mkdir -p dist
        # 版本号写进二进制，让 `ferc version` 能自证身份——排障时第一个要看的就是它。
        # armv6 与 armv7 是两条独立产物：GOARM 不传时 Go 默认给 7，混用会让
        # armv6 设备装上跑不起来的二进制。
        CGO_ENABLED=0 go build -trimpath \
          -ldflags="-s -w -X github.com/FasterEdge/FasterEdgeRunningCore/internal/cli.Version=$version" \
          -o "dist/ferc${{ matrix.ext }}" ./cmd/ferc
    - name: '打包'
      run: |
        set -euo pipefail
        cd dist
        if [ '${{ matrix.goos }}' = 'windows' ]; then
          zip -qr "../ferc-${{ matrix.target }}.zip" "ferc${{ matrix.ext }}"
        else
          tar czf "../ferc-${{ matrix.target }}.tar.gz" "ferc${{ matrix.ext }}"
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: 'ferc-${{ matrix.target }}'
        path: '${{ github.workspace }}/ferc-${{ matrix.target }}.*'
        if-no-files-found: 'error'
        retention-days: 1

  release:
    name: '发布 GitHub Release'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
    - name: '整理产物'
      run: |
        set -euo pipefail
        mkdir -p release
        find artifacts -type f | while read -r f; do
          case "$f" in
            *.tar.gz|*.zip) cp "$f" release/ ;;
          esac
        done
    - name: '生成 MD5/SHA1 校验文件'
      run: |
        set -euo pipefail
        cd release
        # 产物名直接决定 ferc 能否按清单里的命名规则下载到自己，
        # 因此校验文件必须覆盖 release 里的全部产物。
        find . -type f ! -name 'checksums-md5.txt' ! -name 'checksums-sha1.txt' -print0 \
          | sort -z | xargs -0 -r md5sum > checksums-md5.txt
        find . -type f ! -name 'checksums-md5.txt' ! -name 'checksums-sha1.txt' -print0 \
          | sort -z | xargs -0 -r sha1sum > checksums-sha1.txt
    - name: '上传到 Release'
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        files: 'release/*'
        generate_release_notes: true
        fail_on_unmatched_files: false
