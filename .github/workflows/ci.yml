name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-test:
    name: '静态检查 + 单元测试'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: 'gofmt 检查'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      - name: 'go vet'
        run: go vet ./...
      - name: 'go test'
        run: go test -count=1 ./...

  race:
    name: '竞态检测'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: 'go test -race'
        run: go test -race -count=1 ./...

  linux-runtime:
    name: 'Linux 运行时实测'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      # 这些测试带 //go:build linux，在 Windows/macOS 开发机上根本不编译，
      # 因此"非常驻""/proc 观测""内核日志"这三条立论只有在这里才真跑。
      # 单独拉一个 job 是为了让它在 CI 界面上可见——混在 go test ./... 里
      # 看不出哪几条是被跳过的、哪几条是真的过了。
      - name: 'F3 非常驻（/proc 枚举 + 哨兵进程）'
        run: go test -count=1 -v -run 'TestRuncoreIsNotResident|TestInstalledServiceSurvives' ./internal/install/

  cross-build:
    name: '跨平台编译 ${{ matrix.target }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-386,      goos: linux,   goarch: 386,      goarm: '', ext: ''   }
          - { target: linux-amd64,    goos: linux,   goarch: amd64,    goarm: '', ext: ''   }
          - { target: linux-armv6,    goos: linux,   goarch: arm,      goarm: '6', ext: ''   }
          - { target: linux-armv7,    goos: linux,   goarch: arm,      goarm: '7', ext: ''   }
          - { target: linux-arm64,    goos: linux,   goarch: arm64,    goarm: '', ext: ''   }
          - { target: linux-loong64,  goos: linux,   goarch: loong64,  goarm: '', ext: ''   }
          - { target: linux-mips,     goos: linux,   goarch: mips,     goarm: '', ext: ''   }
          - { target: linux-mipsle,   goos: linux,   goarch: mipsle,   goarm: '', ext: ''   }
          - { target: linux-mips64,   goos: linux,   goarch: mips64,   goarm: '', ext: ''   }
          - { target: linux-mips64le, goos: linux,   goarch: mips64le, goarm: '', ext: ''   }
          - { target: linux-ppc64,    goos: linux,   goarch: ppc64,    goarm: '', ext: ''   }
          - { target: linux-ppc64le,  goos: linux,   goarch: ppc64le,  goarm: '', ext: ''   }
          - { target: linux-riscv64,  goos: linux,   goarch: riscv64,  goarm: '', ext: ''   }
          - { target: linux-s390x,    goos: linux,   goarch: s390x,    goarm: '', ext: ''   }
          - { target: darwin-amd64,   goos: darwin,  goarch: amd64,    goarm: '', ext: ''   }
          - { target: darwin-arm64,   goos: darwin,  goarch: arm64,    goarm: '', ext: ''   }
          - { target: windows-386,    goos: windows, goarch: 386,      goarm: '', ext: .exe }
          - { target: windows-amd64,  goos: windows, goarch: amd64,    goarm: '', ext: .exe }
          - { target: windows-arm64,  goos: windows, goarch: arm64,    goarm: '', ext: .exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      # 运行核的价值在于“任意平台都能跑”，因此每个受支持平台都必须能被编译，
      # 且编译后的二进制要真的能回答 --help —— 只编译不执行会漏掉 init 分支的
      # 构建错误。
      # arm 的两条产物靠 GOARM 区分：不传时 Go 默认按 armv7 编，armv6 就被悄悄
      # 漏掉了，所以这里显式透传 GOARM。
      - name: '编译 ${{ matrix.target }}'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "ferc${{ matrix.ext }}" ./cmd/ferc
      - name: '本机可执行时验证 --help'
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./ferc --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: 'ferc-${{ matrix.target }}'
          path: 'ferc${{ matrix.ext }}'
          if-no-files-found: 'error'
          retention-days: 1
